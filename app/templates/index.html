<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/style.css">
  <title>DevDocs Hub</title>
</head>

<body>
  <header>
    <h1>DevDocs Hub</h1>
    <div style="margin-left:auto" class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">checking...</span>
    </div>
  </header>

  <div class="container">

    <!-- Formularul de adăugare -->
    <div class="card">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="title" placeholder="Ex: Flask route decorator">
      </div>
      <div class="form-group">
        <label>Language</label>
        <select id="language">
          <option>python</option>
          <option>javascript</option>
          <option>bash</option>
          <option>sql</option>
          <option>text</option>
        </select>
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea id="content" placeholder="Codul sau nota ta..."></textarea>
      </div>
      <div class="form-group">
        <label>Tags (separate prin virgulă)</label>
        <input type="text" id="tags" placeholder="Ex: flask, api, python">
      </div>
      <button onclick="createSnippet()">Adaugă snippet</button>
    </div>
    
    <!-- Search -->
    <div class="card" style="margin-bottom:1rem;">
      <input
        type="text"
        id="search"
        placeholder="Caută după tag sau titlu... (ex: python, flask)"
        oninput="searchSnippets(this.value)">
    </div>

    <div id="snippets-list"></div>
  </div>

<script src="/static/js/app.js"></script>
</body>
</html>
