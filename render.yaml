services:
  - type: web
    name: devdocs-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devdocs-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: devdocs-db
    plan: free